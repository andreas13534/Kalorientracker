name: iOS build and tests
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Core, iOS and UI tests
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/test_on_mac.sh 2>&1 | tee artifacts/simulator-tests.log
      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/VeloxNutrition.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/VeloxNutrition-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-app
          path: artifacts/VeloxNutrition-simulator.zip
          if-no-files-found: error
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            TestResults-*.xcresult
            artifacts/*.log
