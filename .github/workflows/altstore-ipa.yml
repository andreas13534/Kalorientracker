name: Build IPA for AltStore Classic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download app fonts
        run: python3 scripts/download_fonts.py
      - name: Build iPhone app and package IPA
        run: bash scripts/build_altstore_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VeloxNutrition-AltStore-IPA
          path: artifacts/VeloxNutrition-AltStore.ipa
          if-no-files-found: error
