# Start this workflow manually in Codemagic; no signing credentials are needed.
workflows:
  ios-simulator:
    name: Velox Nutrition - iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build and run Core, iOS and UI tests
        script: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/test_on_mac.sh 2>&1 | tee artifacts/simulator-tests.log
      - name: Package simulator app
        script: |
          #!/bin/bash
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/VeloxNutrition.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/VeloxNutrition-simulator.zip
    artifacts:
      - artifacts/*.zip
      - artifacts/*.log
      - TestResults-*.xcresult
